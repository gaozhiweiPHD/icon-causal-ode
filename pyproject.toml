[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "icon-causal-ode"
version = "0.1.0"
description = "Causal ICON-inspired Transformers with KV communication for coupled ODEs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "PyYAML>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["causal_kv*"]

[tool.setuptools.package-data]
causal_kv = ["default.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
